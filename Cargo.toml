#
# minted by: just repo-init rust-cli (2026)
#
# The package name is the repository slug; the CRATE name (what `use` sees) is
# its underscored form, which is the token used in src/*.rs and tests/*.rs.
# `cargo build --all-targets` and `cargo test --all-targets` are what
# `just build` and `just test` run (provision-lib.sh lang_cmd rust:*).

[package]
name = "chancel"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MPL-2.0"
description = "Planned verifier for Chapel programs: a subset gate and a proof-obligation front end over the Canonry theory. No code yet."
authors = ["Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"]
repository = "https://github.com/hyperpolymath/chancel"
readme = "README.adoc"

[dependencies]

# Keep the release profile explicit: a CLI is shipped as a binary, and the
# defaults differ between toolchains more than they look.
[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
